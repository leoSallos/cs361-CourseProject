<!DOCTYPE html>
<html>
    <head>
        <title>Auto Planner - Personalization</title>
        <meta charset="UTF-8">
        <!-- Load First -->
        <script src="scripts/index.js"></script>
        <!-- -->
        <link rel="stylesheet" type="text/css" href="style/style.css">
        <link rel="stylesheet" type="text/css" href="style/settings.css">
        <script src="scripts/settings.js" defer></script>
    </head>
    <body>
        <header>
            <div class="site-title">
                <a href="/">Auto Planner </a>
            </div>
            <div class="settings-nav">
                <div class="settings-container">
                    <img src="/img/notifications.webp" onclick="notificationsDrawer()" alt="temp notifications" width="75" height="75">
                    <img src="/img/users.webp" onclick="usersDrawer()" alt="temp user" width="75" height="75">
                    <a href="/personalization.html">
                        <img src="/img/cog.webp" alt="temp cog" width="75" height="75">
                    </a>
                    <img src="/img/account.webp" onclick="accountDrawer()" alt="temp account" width="75" height="75">
                </div>
            </div>
        </header>

        <div id="notifications-list-container" class="hidden header-list-container" style="right: 280px;">
        </div>

        <div id="users-list-container" class="hidden header-list-container" style="right: 200px;">
        </div>

        <div id="account-list-container" class="hidden header-list-container" style="right: 50px;">
            <button id="sign-out-button" onclick="signOut();">
                Sign Out
            </button>
        </div>

        <main>
            <div class="side-menu">
                <a href="/">
                    <button class="return-to-calendar-button">Return to Calendar</button>
                </a>
                <div class="personilization-menu">
                    <a href="/personalization.html">
                        <h2>Personalization</h2>
                    </a>
                </div>
            </div>

            <div class="settings-list">
                <div class="settings-list-item">
                    <h1>Tags</h1>
                    <select id="settings-tag-select" class="tag-select" name="tags" multiple>
                    </select>
                    <button id="remove-tags-button">Remove</button>
                    <input id="new-tag-input" type="text" placeholder="Click to Type"></input>
                    <button id="add-tag-button">Add</button>
                </div>
                <div class="settings-list-item">
                    <h1>Timeslots</h1>
                    <div id="timeslots-grid" class="timeslots-grid-container">
                        <p>Sun</p>
                        <p>Mon</p>
                        <p>Tue</p>
                        <p>Wed</p>
                        <p>Thu</p>
                        <p>Fri</p>
                        <p>Sat</p>
                        <div id="sun" class="timeslot-day-container">
                            <button class="add-timeslot-button" onclick="addTimeslot(0)">+</button>
                        </div>
                        <div id="mon" class="timeslot-day-container">
                            <button class="add-timeslot-button" onclick="addTimeslot(1)">+</button>
                        </div>
                        <div id="tue" class="timeslot-day-container">
                            <button class="add-timeslot-button" onclick="addTimeslot(2)">+</button>
                        </div>
                        <div id="wed" class="timeslot-day-container">
                            <button class="add-timeslot-button" onclick="addTimeslot(3)">+</button>
                        </div>
                        <div id="thu" class="timeslot-day-container">
                            <button class="add-timeslot-button" onclick="addTimeslot(4)">+</button>
                        </div>
                        <div id="fri" class="timeslot-day-container">
                            <button class="add-timeslot-button" onclick="addTimeslot(5)">+</button>
                        </div>
                        <div id="sat" class="timeslot-day-container">
                            <button class="add-timeslot-button" onclick="addTimeslot(6)">+</button>
                        </div>
                    </div>
                </div>
                <div class="settings-list-item">
                    <h1>Clock</h1>
                    <select id="clock-settings-select">
                        <option value="12hr">12 Hour</option>
                        <option value="24hr">24 Hour</option>
                    </select>
                </div>
                <div class="settings-list-item">
                    <h1>Themes</h1>
                    <select id="theme-select">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="high-contrast">High-Contrast</option>
                    </select>
                </div>
            </div>
        </main>

        <footer>
        </footer>
    </body>
</html>
